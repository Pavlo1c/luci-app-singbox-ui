name: Build luci-app-singbox-ui from PR
run-name: Build artifact PR ${{ github.event.pull_request.number || github.ref_name }}

on:
  push:
    branches:
      - chatgpt/ci-openwrt-ipk-apk-release
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.pkg_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg_type: [ipk, apk]

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 1

      - name: Build Docker image (${{ matrix.pkg_type }})
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile-${{ matrix.pkg_type }}
          tags: singbox-ui-${{ matrix.pkg_type }}:ci

      - name: Create Docker container
        run: docker create --name singbox-ui-${{ matrix.pkg_type }} singbox-ui-${{ matrix.pkg_type }}:ci

      - name: Copy built package from Docker container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./sdk-output ./artifacts
          docker cp singbox-ui-${{ matrix.pkg_type }}:/builder/bin/packages/x86_64/luci/. ./sdk-output/
          shopt -s nullglob
          packages=(./sdk-output/luci-app-singbox-ui*.${{ matrix.pkg_type }})
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one luci-app-singbox-ui .${{ matrix.pkg_type }} package; found ${#packages[@]}" >&2
            ls -la ./sdk-output/
            exit 1
          fi
          cp "${packages[0]}" ./artifacts/

      - name: Remove Docker container
        if: always()
        run: docker rm -f singbox-ui-${{ matrix.pkg_type }} || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: built-${{ matrix.pkg_type }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
