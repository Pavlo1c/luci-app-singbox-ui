name: Build luci-app-singbox-ui from TAG
run-name: Build release TAG ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.pkg_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg_type: [ipk, apk]

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 1

      - name: Set package version from tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${TAG_VERSION}" == "${GITHUB_REF_NAME}" ]] || ! [[ "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v2.3.11; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          sed -i "s/^PKG_VERSION:=.*$/PKG_VERSION:=${TAG_VERSION}/" luci-app-singbox-ui/Makefile
          grep '^PKG_VERSION:=' luci-app-singbox-ui/Makefile

      - name: Build Docker image (${{ matrix.pkg_type }})
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile-${{ matrix.pkg_type }}
          tags: singbox-ui-${{ matrix.pkg_type }}:release

      - name: Create Docker container
        run: docker create --name singbox-ui-${{ matrix.pkg_type }} singbox-ui-${{ matrix.pkg_type }}:release

      - name: Copy built package from Docker container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./sdk-output ./pkg-out
          docker cp singbox-ui-${{ matrix.pkg_type }}:/builder/bin/packages/x86_64/luci/. ./sdk-output/
          shopt -s nullglob
          packages=(./sdk-output/luci-app-singbox-ui*.${{ matrix.pkg_type }})
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one luci-app-singbox-ui .${{ matrix.pkg_type }} package; found ${#packages[@]}" >&2
            ls -la ./sdk-output/
            exit 1
          fi
          cp "${packages[0]}" "./pkg-out/luci-app-singbox-ui.${{ matrix.pkg_type }}"

      - name: Remove Docker container
        if: always()
        run: docker rm -f singbox-ui-${{ matrix.pkg_type }} || true

      - name: Upload built package
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pkg-${{ matrix.pkg_type }}
          path: pkg-out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download IPK artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-ipk
          path: release/

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-apk
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.4.0
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.ipk
            release/*.apk
          draft: false
          prerelease: false
