name: Manual build luci-app-singbox-ui (IPK + APK)
run-name: Manual package build from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or tag to build"
        required: true
        default: "chatgpt/ci-openwrt-ipk-apk-release"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.pkg_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg_type: [ipk, apk]

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Build SDK image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile-${{ matrix.pkg_type }}
          tags: singbox-ui-${{ matrix.pkg_type }}:manual

      - name: Create build container
        run: docker create --name singbox-ui-${{ matrix.pkg_type }} singbox-ui-${{ matrix.pkg_type }}:manual

      - name: Extract package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./sdk-output ./artifacts
          docker cp singbox-ui-${{ matrix.pkg_type }}:/builder/bin/packages/x86_64/luci/. ./sdk-output/
          shopt -s nullglob
          packages=(./sdk-output/luci-app-singbox-ui*.${{ matrix.pkg_type }})
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one luci-app-singbox-ui .${{ matrix.pkg_type }} package; found ${#packages[@]}" >&2
            find ./sdk-output -maxdepth 2 -type f -print
            exit 1
          fi
          cp "${packages[0]}" ./artifacts/

      - name: Remove build container
        if: always()
        run: docker rm -f singbox-ui-${{ matrix.pkg_type }} || true

      - name: Upload package artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: luci-app-singbox-ui-${{ matrix.pkg_type }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
